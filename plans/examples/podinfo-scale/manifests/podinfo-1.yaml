apiVersion: apps/v1
kind: Deployment
metadata:
  name: kourt-podinfo
  namespace: default
  labels:
    app.kubernetes.io/managed-by: kourt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kourt-podinfo
  template:
    metadata:
      labels:
        app: kourt-podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - containerPort: 9898
