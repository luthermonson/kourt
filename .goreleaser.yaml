# goreleaser v2 config. `goreleaser release --snapshot --clean` builds every
# target locally; the Makefile's `cross` target does the same without goreleaser.
version: 2
project_name: litecone
builds:
  - id: litecone
    main: ./cmd/litecone
    binary: litecone
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - PLAN-FORMAT.md
      - LICENSE*
checksum:
  name_template: checksums.txt
changelog:
  use: git
release:
  draft: true
